name: Block 1 QA — Kage Foreground
on:
  push:
    branches: [block-1-kage-foreground]
  pull_request:
    branches: [main]
jobs:
  foreground:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: |
          npm init -y
          npm install --save-dev @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/faro2.log 2>&1 &
          sleep 2
          mkdir -p qa-artifacts/block1
          npx playwright test tests/foreground-kage-port.spec.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block1-foreground-evidence
          path: qa-artifacts/block1/

name: Vercel Human Review QA

on:
  workflow_dispatch:
  push:
    branches: [block-1-kage-foreground]
    paths:
      - '.github/workflows/vercel-human-review.yml'

jobs:
  live-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live Vercel review on desktop and mobile
        env:
          REVIEW_URL: https://faro-2-review.vercel.app/
          EXPECTED_SHA: b677eac031fef88ea4dd49144f59ce6f6defe08e
        run: |
          cat > verify-live.js <<'EOF'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const REVIEW_URL = process.env.REVIEW_URL;
          const EXPECTED_SHA = process.env.EXPECTED_SHA;
          fs.mkdirSync('qa-artifacts/vercel-human-review', { recursive: true });

          async function jump(page,id,delay=900){
            await page.evaluate((id)=>{
              const el=document.getElementById(id);
              if(!el) throw new Error('Missing section '+id);
              const r=el.getBoundingClientRect();
              const top=window.scrollY+r.top;
              window.scrollTo(0,Math.max(0,top+(r.height-window.innerHeight)/2));
            },id);
            await page.waitForTimeout(delay);
          }

          async function verify(viewport, label) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport, permissions: ['clipboard-read','clipboard-write'] });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('PAGEERROR: ' + (e.stack || e.message)));
            page.on('console', m => { if (m.type() === 'error') errors.push('CONSOLE: ' + m.text()); });

            try {
              const response = await page.goto(REVIEW_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
              assert(response && response.ok(), `Vercel ${label} HTTP failed: ${response && response.status()}`);
              await page.waitForFunction(() => document.body && document.body.innerText.includes('THE LAST LIGHTHOUSE'), null, { timeout: 60000 });
              await page.waitForFunction(() => window.__FARO_QA__?.ready === true, null, { timeout: 60000 });

              const resourceUrls = await page.evaluate(() => performance.getEntriesByType('resource').map(r => r.name));
              assert(resourceUrls.some(u => u.includes(EXPECTED_SHA) && u.endsWith('/app.js')), 'Live review is not using expected immutable app.js SHA');
              assert(resourceUrls.some(u => u.includes(EXPECTED_SHA) && u.includes('foreground-kage-port.css')), 'Live review is not using expected foreground CSS SHA');

              await jump(page,'coast');
              await page.waitForFunction(() => !!document.querySelector('#fg-sky [data-fg="coast"].fg-active'), null, { timeout: 10000 });
              await jump(page,'keeper',700);
              await page.waitForFunction(() => !!document.querySelector('#fg-sky [data-fg="keeper"].fg-active'), null, { timeout: 10000 });
              await jump(page,'beam');

              const trigger = page.locator('#support-trigger');
              await trigger.waitFor({ state: 'visible', timeout: 10000 });
              await trigger.click();
              await page.locator('#copy-signal').waitFor({ state: 'visible', timeout: 10000 });
              await page.locator('#copy-signal').click();
              await page.locator('#answer-event.show').waitFor({ state: 'visible', timeout: 10000 });
              await page.locator('#phasea-answer-listen').waitFor({ state: 'visible', timeout: 10000 });
              await page.locator('#phasea-answer-listen').click();
              await page.locator('#phasea-overlay.open').waitFor({ state: 'visible', timeout: 10000 });
              assert.equal(await page.locator('#phasea-overlay').getAttribute('data-room'), 'listen');

              await page.locator('#record-hero').click();
              await page.waitForFunction(() => document.querySelector('#phasea-overlay')?.getAttribute('data-room') === 'record');
              await page.locator('[data-mode="free"]').waitFor({ state: 'visible', timeout: 10000 });

              await page.locator('#phasea-back').click();
              await page.waitForFunction(() => document.querySelector('#phasea-overlay')?.getAttribute('data-room') === 'listen');
              await page.locator('[data-rnav="workshop"]').click();
              await page.locator('.b1-home').waitFor({ state: 'visible', timeout: 10000 });
              await page.locator('[data-rnav="radio"]').click();
              await page.locator('.broadcast-console').waitFor({ state: 'visible', timeout: 10000 });
              await page.locator('[data-rnav="learn"]').click();
              await page.locator('.learning-route').waitFor({ state: 'visible', timeout: 10000 });
              await page.locator('#phasea-close').click();
              await page.waitForFunction(() => !document.querySelector('#phasea-overlay')?.classList.contains('open'));

              if (viewport.width <= 500) {
                await page.locator('#burger').click();
                await page.waitForFunction(() => document.body.classList.contains('nav-open'));
                await page.locator('#navlinks a[href="#keeper"]').click();
                await page.waitForTimeout(700);
                assert((await page.locator('#keeper').boundingBox()) !== null, 'Keeper section missing after mobile nav');
              }

              assert.equal(errors.length, 0, `${label} console/page errors:\n${errors.join('\n')}`);
            } finally {
              await page.screenshot({ path: `qa-artifacts/vercel-human-review/${label}.png`, fullPage: false }).catch(()=>{});
              fs.writeFileSync(`qa-artifacts/vercel-human-review/${label}-errors.json`, JSON.stringify(errors, null, 2));
              await browser.close();
            }
          }

          (async () => {
            await verify({ width: 1440, height: 1000 }, 'desktop-1440x1000');
            await verify({ width: 390, height: 844 }, 'mobile-390x844');
            console.log('VERCEL HUMAN REVIEW QA: PASS desktop + mobile');
          })().catch(err => { console.error(err); process.exit(1); });
          EOF
          node verify-live.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-human-review-evidence
          path: qa-artifacts/vercel-human-review/
          if-no-files-found: ignore

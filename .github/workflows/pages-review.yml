name: FARO-2 Public Review — GitHub Pages

on:
  push:
    branches:
      - block-1-kage-foreground
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

automation:
  enabled: true

concurrency:
  group: faro-2-pages-review
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FARO-2 review branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

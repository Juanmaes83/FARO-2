name: Block 1 Runtime Ownership Fix

on:
  push:
    branches:
      - block-1-kage-foreground
    paths:
      - scripts/block1-runtime-fix.py
      - .github/workflows/block1-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: block-1-kage-foreground
          fetch-depth: 0
      - run: python3 scripts/block1-runtime-fix.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: make Kage foreground ownership deterministic"
          git push origin HEAD:block-1-kage-foreground
